apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project-with-specific-namespace
  namespace: argocd
spec:
  description: project-with-specific-namespace
  sourceRepos:
  - '*'
  destinations:
  - namespace: ns1
    server: https://kubernetes.default.svc

  clusterResourceWhitelist:
  - group: '*'
    kind: '*'

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'