apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project-with-specific-namespace
  namespace: ns1
spec:
  description: project-with-specific-namespace
  sourceRepos:
  - '*'
  destinations:
  - namespace: "ns1"
    server: "kubernetes.default.svc"
  syncPolicy:
    syncOptions:
    - CreateNameSpace=true

  clusterResourceWhitelist:
  - group: '*'
    kind: '*'

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'