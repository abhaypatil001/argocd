apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-dev-project
  namespace: argocd
spec:
  destination:
    namespace: ns1
    server: https://kubernetes.default.svc
  project: project-with-specific-namespace
  source:
    path: guestbook
    repoURL: "ttps://github.com/mabusaa/argocd-example-apps.git
    targetRevision: master
  syncPolicy:
    syncOptions:
      - CreateNamespace=true